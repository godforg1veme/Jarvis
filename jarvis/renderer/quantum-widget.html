<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Quantum Core Widget</title>
  <link rel="stylesheet" href="quantum-widget.css">
</head>
<body>
  <div id="widget-container" class="widget-container">
    <!-- 3D WebGL Canvas Layer -->
    <div id="canvas-container" class="canvas-container"></div>

    <!-- Stark Tech HUD Overlay (Visible on Hover / Active) -->
    <div class="hud-overlay">
      <div class="hud-status" id="hud-status">
        <span class="status-dot"></span>
        <span class="status-text" id="status-text">JARVIS // CORE</span>
      </div>

      <div class="hud-controls no-drag">
        <button class="hud-btn" id="btn-chat" title="Открыть чат Джарвиса">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </button>
        <button class="hud-btn active" id="btn-pin" title="Закрепить поверх окон">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="17" x2="12" y2="22"></line>
            <path d="M5 17h14l-2-7V4h1V2H6v2h1v6z"></path>
          </svg>
        </button>
        <button class="hud-btn" id="btn-close" title="Скрыть в трей">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="quantumCore.js"></script>
  <script src="quantum-widget.js"></script>
</body>
</html>
