<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Jarvis Transcription Bar</title>
  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self';">
  <link rel="stylesheet" href="transcription-bar.css">
</head>
<body>
  <div id="drag-container" class="transcription-bar">
    <!-- Drag handle icon -->
    <div class="drag-handle" title="Перетащить">
      <svg class="icon-drag" viewBox="0 0 24 24" width="16" height="16">
        <path fill="currentColor" d="M8.5 6a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm5 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm5 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm-10 6a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm5 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm5 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm-10 6a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm5 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm5 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0z"/>
      </svg>
    </div>

    <!-- Status indicator (glowing LED dot) -->
    <div class="status-indicator-container">
      <div id="status-led" class="status-led idle"></div>
    </div>

    <!-- Live text view -->
    <div class="text-container">
      <span id="transcription-text" class="placeholder">Джарвис готов к работе</span>
    </div>

    <!-- Interactive control elements -->
    <div class="controls-container">
      <button id="close-btn" class="control-btn" title="Скрыть панель">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>
  <script src="transcription-bar.js"></script>
</body>
</html>
