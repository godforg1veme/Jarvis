<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <title>Jarvis Quantum Core Preview</title>
  <style>
    :root {
      --bg: #040711;
      --cyan: #38bdf8;
      --panel: rgba(10, 16, 32, 0.85);
      --border: rgba(255, 255, 255, 0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      background: var(--bg);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle at center, #0c1527 0%, #040711 75%);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.15);
    }
    #coreCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--cyan);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      font-family: monospace;
    }
    .controls {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: var(--panel);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--cyan);
    }
    .btn.active {
      background: var(--cyan);
      color: #030712;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="coreCanvas"></canvas>
    <div id="hudMode" class="hud-badge">MODE: IDLE</div>
    <div class="controls">
      <button class="btn active" onclick="setMode('idle', this)">Idle</button>
      <button class="btn" onclick="setMode('speech', this)">Speech</button>
      <button class="btn" onclick="setMode('vortex', this)">Vortex</button>
      <button class="btn" onclick="setMode('scanner', this)">Scanner</button>
      <button class="btn" onclick="setMode('alert', this)">Alert</button>
    </div>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="quantumCore.js"></script>
  <script>
    const canvas = document.getElementById('coreCanvas');
    const hudMode = document.getElementById('hudMode');
    let core = null;

    try {
      core = window.createQuantumCore({
        canvas: canvas,
        container: document.getElementById('stage'),
        width: 480,
        height: 480,
        mouseTracking: true,
        autoStart: true,
      });
      window.__core = core;
    } catch (err) {
      console.error('Failed to init QuantumCore:', err);
    }

    function setMode(mode, btn) {
      if (!core) return;
      core.setMode(mode);
      hudMode.innerText = 'MODE: ' + mode.toUpperCase();
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      if (mode === 'speech') {
        core.setAudioLevel(0.85);
      } else {
        core.setAudioLevel(0);
      }
    }

    // Automated test hook for Playwright
    window.runSelfTest = function() {
      if (!core) throw new Error('QuantumCore instance not created');
      const results = [];

      ['idle', 'speech', 'vortex', 'scanner', 'alert', 'idle'].forEach(m => {
        core.setMode(m);
        results.push({ mode: m, ok: core.mode === m });
      });

      core.setAudioLevel(0.75, [100, 200, 150, 80]);
      results.push({ audioLevel: core.audioAmplitude === 0.75 });

      core.setSpeed(1.2);
      core.setPulse(1.1);
      core.setScale(0.95);
      core.updateMouse(0.2, 0.4);

      return {
        success: true,
        tests: results,
        canvasWidth: canvas.width,
        canvasHeight: canvas.height,
      };
    };
  </script>
</body>
</html>
