name: jarvis-family

services:
  job-ocr:
    profiles: [job-captcha-de]
    platform: linux/amd64
    build:
      context: ../job-ocr
    user: "1001:1001"
    init: true
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    volumes:
      - job-ocr-socket:/run/job-ocr
    healthcheck:
      test: [CMD, python, health.py]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 64
  job-browser:
    profiles: [job-search-de]
    build:
      context: ../job-browser
      dockerfile: Dockerfile
    init: true
    user: pwuser
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      JARVIS_JOB_BROWSER_ENABLED: "1"
      JARVIS_JOB_BROWSER_OWNER_ID: ${JARVIS_JOB_BROWSER_OWNER_ID:-}
      JARVIS_JOB_BROWSER_TOKEN: ${JARVIS_JOB_BROWSER_TOKEN:-}
      JARVIS_JOB_BROWSER_APPLY_ENABLED: ${JARVIS_JOB_BROWSER_APPLY_ENABLED:-0}
      JARVIS_JOB_BROWSER_APPLY_TOKEN: ${JARVIS_JOB_BROWSER_APPLY_TOKEN:-}
      JARVIS_HH_CAPTCHA_RECOVERY: ${JARVIS_HH_CAPTCHA_RECOVERY:-0}
    volumes:
      - job-browser-profile:/home/pwuser/profile
      - job-ocr-socket:/run/job-ocr:ro
    networks: [job-browser-rpc]
    shm_size: 256m
    pids_limit: 256
    cap_drop: [ALL]
    # Chromium's sandbox needs chroot in its user namespace; no SYS_ADMIN.
    cap_add: [SYS_CHROOT]
    security_opt:
      - no-new-privileges:true
      - seccomp=./job-browser/seccomp_profile.json
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health',{headers:{authorization:'Bearer '+process.env.JARVIS_JOB_BROWSER_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 256
  job-collector:
    profiles: [job-search-de]
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    command: [node, src/jobs/collectorMain.js]
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JARVIS_JOB_SEARCH_ENABLED: ${JARVIS_JOB_SEARCH_ENABLED:-false}
      JARVIS_JOB_COLLECTOR_INTERVAL_MS: ${JARVIS_JOB_COLLECTOR_INTERVAL_MS:-1800000}
      JARVIS_JOB_HISTORY_DAYS: ${JARVIS_JOB_HISTORY_DAYS:-14}
      JARVIS_JOB_BROWSER_URL: http://job-browser:8080
      JARVIS_JOB_BROWSER_OWNER_ID: ${JARVIS_JOB_BROWSER_OWNER_ID:-}
      JARVIS_JOB_BROWSER_TOKEN: ${JARVIS_JOB_BROWSER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      job-browser:
        condition: service_healthy
    networks: [backend, job-browser-rpc]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/001-extensions.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JARVIS_SERVER_HOST: 0.0.0.0
      JARVIS_SERVER_PORT: 3210
      JARVIS_LOG_LEVEL: ${JARVIS_LOG_LEVEL:-info}
      JARVIS_TRUST_PROXY: "true"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_ALLOWED_IDS: ${TELEGRAM_ALLOWED_IDS:?TELEGRAM_ALLOWED_IDS is required}
      JARVIS_MODEL_PROVIDER: ${JARVIS_MODEL_PROVIDER:-echo}
      JARVIS_MODEL_FALLBACK_PROVIDER: ${JARVIS_MODEL_FALLBACK_PROVIDER:-}
      JARVIS_MODEL_TIMEOUT_MS: ${JARVIS_MODEL_TIMEOUT_MS:-60000}
      SALAD_BASE_URL: ${SALAD_BASE_URL:-https://ai.salad.cloud/v1}
      SALAD_API_KEY: ${SALAD_API_KEY:-}
      SALAD_MODEL: ${SALAD_MODEL:-}
      SALAD_AUTH_MODE: ${SALAD_AUTH_MODE:-bearer}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      JARVIS_JOB_SEARCH_ENABLED: ${JARVIS_JOB_SEARCH_ENABLED:-false}
      JARVIS_JOB_MODEL: ${JARVIS_JOB_MODEL:-}
      JARVIS_JOB_BUDGET_USD: ${JARVIS_JOB_BUDGET_USD:-3}
      JARVIS_JOB_SECRET_KEY: ${JARVIS_JOB_SECRET_KEY:-}
      JARVIS_JOB_PUBLIC_ORIGIN: ${JARVIS_JOB_PUBLIC_ORIGIN:-}
      JARVIS_JOB_BROWSER_URL: http://job-browser:8080
      JARVIS_JOB_BROWSER_OWNER_ID: ${JARVIS_JOB_BROWSER_OWNER_ID:-}
      JARVIS_JOB_BROWSER_TOKEN: ${JARVIS_JOB_BROWSER_TOKEN:-}
      JARVIS_JOB_BROWSER_APPLY_ENABLED: ${JARVIS_JOB_BROWSER_APPLY_ENABLED:-0}
      JARVIS_JOB_BROWSER_APPLY_TOKEN: ${JARVIS_JOB_BROWSER_APPLY_TOKEN:-}
      HH_CLIENT_ID: ${HH_CLIENT_ID:-}
      HH_CLIENT_SECRET: ${HH_CLIENT_SECRET:-}
      HH_USER_AGENT: ${HH_USER_AGENT:-JarvisJobSearch/1.0}
      HH_APP_TOKEN: ${HH_APP_TOKEN:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      OPENROUTER_FALLBACK_API_KEY: ${OPENROUTER_FALLBACK_API_KEY:-}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-}
      OPENROUTER_REASONING_EFFORT: ${OPENROUTER_REASONING_EFFORT:-}
      OPENROUTER_REASONING_EXCLUDE: ${OPENROUTER_REASONING_EXCLUDE:-true}
      JARVIS_VISION_PROVIDER: ${JARVIS_VISION_PROVIDER:-disabled}
      JARVIS_VISION_BASE_URL: ${JARVIS_VISION_BASE_URL:-https://openrouter.ai/api/v1}
      JARVIS_VISION_API_KEY: ${JARVIS_VISION_API_KEY:-}
      JARVIS_VISION_MODEL: ${JARVIS_VISION_MODEL:-}
      JARVIS_VISION_TIMEOUT_MS: ${JARVIS_VISION_TIMEOUT_MS:-60000}
      JARVIS_VISION_MEMORY_PATH: ${JARVIS_VISION_MEMORY_PATH:-/srv/jarvis/vision}
      JARVIS_VISION_MEMORY_KEY: ${JARVIS_VISION_MEMORY_KEY:-}
      JARVIS_VISION_USER_QUOTA_BYTES: ${JARVIS_VISION_USER_QUOTA_BYTES:-1073741824}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      JARVIS_DOCUMENT_STORAGE_PATH: ${JARVIS_DOCUMENT_STORAGE_PATH:-/srv/jarvis/documents}
      JARVIS_DOCUMENT_MAX_BYTES: ${JARVIS_DOCUMENT_MAX_BYTES:-20971520}
      JARVIS_DOCUMENT_USER_QUOTA_BYTES: ${JARVIS_DOCUMENT_USER_QUOTA_BYTES:-1073741824}
      JARVIS_DOCUMENT_WORKER_INTERVAL_MS: ${JARVIS_DOCUMENT_WORKER_INTERVAL_MS:-2000}
      JARVIS_PDFTOTEXT_BIN: ${JARVIS_PDFTOTEXT_BIN:-pdftotext}
      JARVIS_FFPROBE_BIN: ${JARVIS_FFPROBE_BIN:-ffprobe}
      JARVIS_EMBEDDING_PROVIDER: ${JARVIS_EMBEDDING_PROVIDER:-disabled}
      JARVIS_EMBEDDING_BASE_URL: ${JARVIS_EMBEDDING_BASE_URL:-}
      JARVIS_EMBEDDING_API_KEY: ${JARVIS_EMBEDDING_API_KEY:-}
      JARVIS_EMBEDDING_MODEL: ${JARVIS_EMBEDDING_MODEL:-}
      JARVIS_EMBEDDING_DIMENSIONS: ${JARVIS_EMBEDDING_DIMENSIONS:-0}
      JARVIS_EMBEDDING_TIMEOUT_MS: ${JARVIS_EMBEDDING_TIMEOUT_MS:-60000}
      JARVIS_EMBEDDING_BATCH_SIZE: ${JARVIS_EMBEDDING_BATCH_SIZE:-32}
      JARVIS_ASR_PROVIDER: ${JARVIS_ASR_PROVIDER:-disabled}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_MODEL: ${ASR_MODEL:-}
      JARVIS_ASR_TIMEOUT_MS: ${JARVIS_ASR_TIMEOUT_MS:-60000}
      JARVIS_TELEGRAM_VOICE_ENABLED: ${JARVIS_TELEGRAM_VOICE_ENABLED:-false}
      JARVIS_LIFE_OS_ENABLED: ${JARVIS_LIFE_OS_ENABLED:-false}
      JARVIS_LIFE_OS_ENRICHMENT_ENABLED: ${JARVIS_LIFE_OS_ENRICHMENT_ENABLED:-false}
      JARVIS_LIFE_OS_PROACTIVITY_ENABLED: ${JARVIS_LIFE_OS_PROACTIVITY_ENABLED:-false}
      JARVIS_LIFE_OS_WORKER_INTERVAL_MS: ${JARVIS_LIFE_OS_WORKER_INTERVAL_MS:-2000}
      JARVIS_OPERATIONS_ENABLED: ${JARVIS_OPERATIONS_ENABLED:-false}
      JARVIS_OPERATIONS_HOST_KEY: ${JARVIS_OPERATIONS_HOST_KEY:-vps}
      JARVIS_OPERATIONS_HOST_LABEL: ${JARVIS_OPERATIONS_HOST_LABEL:-Jarvis VPS}
      JARVIS_OPERATIONS_SOCKET_PATH: ${JARVIS_OPERATIONS_SOCKET_PATH:-/run/jarvis-host-agent/agent.sock}
      JARVIS_OPERATIONS_NL_HOST_KEY: ${JARVIS_OPERATIONS_NL_HOST_KEY:-vpn-nl}
      JARVIS_OPERATIONS_NL_HOST_LABEL: ${JARVIS_OPERATIONS_NL_HOST_LABEL:-Netherlands VPN VPS}
      JARVIS_OPERATIONS_NL_SOCKET_PATH: ${JARVIS_OPERATIONS_NL_SOCKET_PATH:-/run/jarvis-host-agent/agent-nl.sock}
      JARVIS_OPERATIONS_AUTHENTICATOR_PATH: ${JARVIS_OPERATIONS_AUTHENTICATOR_PATH:-/run/secrets/operations_host_agent_authenticator}
      JARVIS_OPERATIONS_POLL_INTERVAL_MS: ${JARVIS_OPERATIONS_POLL_INTERVAL_MS:-30000}
      JARVIS_OPERATIONS_OWNER_TELEGRAM_ID: ${JARVIS_OPERATIONS_OWNER_TELEGRAM_ID:-0}
      JARVIS_OPERATIONS_PUBLIC_ORIGIN: ${JARVIS_OPERATIONS_PUBLIC_ORIGIN:-}
      JARVIS_VPN_SUPERVISOR_ACCEPTANCE_ENABLED: ${JARVIS_VPN_SUPERVISOR_ACCEPTANCE_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3210/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - document-data:/srv/jarvis/documents
      - vision-data:/srv/jarvis/vision
      - /run/jarvis-host-agent:/run/jarvis-host-agent:ro
    secrets:
      - operations_host_agent_authenticator
    networks: [backend, job-browser-rpc]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  qwen-asr:
    profiles: ["qwen-asr-benchmark"]
    build:
      context: ..
      dockerfile: deploy/qwen-asr.Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      QWEN_ASR_MODEL: ${QWEN_ASR_MODEL:-Qwen/Qwen3-ASR-1.7B}
      QWEN_ASR_MODEL_REVISION: ${QWEN_ASR_MODEL_REVISION:-7278e1e70fe206f11671096ffdd38061171dd6e5}
    volumes:
      - qwen-asr-models:/models
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G

  gigaam-asr:
    profiles: ["asr"]
    build:
      context: ..
      dockerfile: deploy/gigaam-asr.Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - gigaam-asr-models:/models
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
          pids: 512

  caddy:
    image: caddy:2.10-alpine
    profiles: ["direct"]
    restart: unless-stopped
    environment:
      JARVIS_DOMAIN: ${JARVIS_DOMAIN:-unused.invalid}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    # The image defaults to UID 65532, while Compose mounts file-backed secrets
    # owner-readable. Run this isolated ingress process as root solely to read
    # its read-only tunnel token.
    user: "0:0"
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      server:
        condition: service_healthy
    networks: [backend]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  job-browser-rpc:
    internal: false
  backend:
    internal: false

volumes:
  job-ocr-socket:
  job-browser-profile:
    external: true
    name: ${JARVIS_JOB_BROWSER_PROFILE_VOLUME:-jarvis-hh-owner-profile}
  postgres-data:
  document-data:
  vision-data:
  qwen-asr-models:
  gigaam-asr-models:
  caddy-data:
  caddy-config:

secrets:
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare-tunnel-token
  operations_host_agent_authenticator:
    file: ./secrets/operations-host-agent-authenticator
