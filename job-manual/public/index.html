<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>HH · Jarvis</title><link rel="stylesheet" href="/hh/style.css"><script type="module" src="/hh/app.js"></script></head>
<body><header><h1>Ручная проверка HH</h1><p id="status" role="status">Проверяем состояние…</p><div class="actions"><button id="start" hidden>Начать ручную проверку</button><button id="connect" hidden>Подключиться</button><button id="refresh" hidden>Обновить проверку</button><button id="done" hidden>Готово</button></div></header><main id="screen" aria-label="Браузер HH"></main><footer id="keyboard-panel" hidden><label for="keyboard">Текст для поля в HH</label><input id="keyboard" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text" aria-label="Ввод на русском и английском"><button id="enter">Ввод ↵</button><p>Нажми поле на экране HH, затем набирай здесь: символы сразу передаются в HH, а это поле очищается. После «Отправить» в HH нажми «Готово» сверху. Для новой картинки используй верхнюю кнопку «Обновить проверку», а не стрелку внутри HH.</p></footer></body></html>
